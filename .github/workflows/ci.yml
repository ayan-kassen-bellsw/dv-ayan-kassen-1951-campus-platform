name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all fetched branches and tags with Gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$SHA256" "$archive" | sha256sum --check
          tar xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all HEAD" --redact=100 --verbose .

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit production and development dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --strict -r requirements-dev.txt

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the application image used by Compose
        id: build
        run: docker build --pull --platform linux/amd64 --provenance=false --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag campus-app:dev .
      - name: Check immutable publication and release promotion offline
        run: bash .github/scripts/test-publish-ecr.sh
      - name: Verify PostgreSQL persistence and the HTTP password policy
        run: bash .github/scripts/compose-smoke.sh
      - name: Verify PostgreSQL, both application replicas and Traefik on k3s
        run: bash .github/scripts/test-k3s.sh .github/scripts/test-k8s-postgres.sh .github/scripts/test-k8s-app.sh
      - name: Scan the final image for HIGH and CRITICAL vulnerabilities
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bash .github/scripts/install-trivy.sh
          "$RUNNER_TEMP/trivy" image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 campus-app:dev
      - name: Save the verified image for ECR publication
        if: vars.ECR_PUBLISH_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save -o "$RUNNER_TEMP/app.tar" campus-app:dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: vars.ECR_PUBLISH_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: app-${{ github.sha }}
          path: ${{ runner.temp }}/app.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Terraform
        env:
          VERSION: 1.17.2
          SHA256: e6f16b2f0b137ee5729caa8c4e79a3bae4ee261acd198a1fcfa8584a6296605b
        run: |
          archive="$RUNNER_TEMP/terraform.zip"
          curl -fsSL --retry 3 -o "$archive" "https://releases.hashicorp.com/terraform/$VERSION/terraform_${VERSION}_linux_amd64.zip"
          printf '%s  %s\n' "$SHA256" "$archive" | sha256sum --check
          unzip -oq "$archive" terraform -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check Terraform formatting
        run: |
          terraform fmt -check -diff -recursive infra
          terraform fmt -check -diff .github/scripts/learner-lab.tftest.hcl
      - name: Scan Terraform for HIGH and CRITICAL misconfigurations
        run: |
          bash .github/scripts/install-trivy.sh
          "$RUNNER_TEMP/trivy" config --severity HIGH,CRITICAL --exit-code 1 infra
          printf '%s\n' 'learner_lab = { bucket_name = "dv-ayan-kassen-1951-bootstrap-ci" }' > "$RUNNER_TEMP/learner.tfvars"
          "$RUNNER_TEMP/trivy" config --tf-vars "$RUNNER_TEMP/learner.tfvars" --severity HIGH,CRITICAL --exit-code 1 infra
      - name: Verify standard and Learner Lab Terraform plans and k3s bootstrap
        run: bash .github/scripts/terraform-plan.sh
      - name: Scan the rendered PostgreSQL and application manifests
        run: |
          mkdir -p "$RUNNER_TEMP/k8s-manifests"
          kubectl kustomize k8s/postgres > "$RUNNER_TEMP/k8s-manifests/postgres.yaml"
          export GIT_SHA="$GITHUB_SHA" APP_VERSION=ci APP_OWNER="Scholarship CI"
          export APP_IMAGE="123456789012.dkr.ecr.us-east-1.amazonaws.com/dv-ayan-kassen-1951-scholarship-applications@sha256:$(printf '%064d' 0)"
          bash ops/deploy-app.sh render > "$RUNNER_TEMP/k8s-manifests/app.yaml"
          "$RUNNER_TEMP/trivy" config --severity HIGH,CRITICAL --exit-code 1 \
            --ignore-policy .github/scripts/postgres-trivy.rego "$RUNNER_TEMP/k8s-manifests"
