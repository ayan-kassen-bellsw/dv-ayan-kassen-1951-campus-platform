name: ECR release tag
run-name: ${{ github.event.created && !github.event.deleted && github.ref || 'Ignored tag update' }}

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  signal:
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Signal the publisher on the default branch
        run: echo "The default-branch release workflow verifies this tag and waits for prod approval."
