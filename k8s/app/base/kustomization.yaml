apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dv-ayan-kassen-1951
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
configMapGenerator:
  - name: dv-ayan-kassen-1951-app-config
    literals:
      - APP_NAME=Scholarship applications
      - DB_URL=postgresql+psycopg://app_rw:${DB_PASSWORD}@dv-ayan-kassen-1951-postgres:5432/campus
      - LOG_FORMAT=json
      - STORAGE_BACKEND=database
