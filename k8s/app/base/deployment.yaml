apiVersion: apps/v1
kind: Deployment
metadata:
  name: dv-ayan-kassen-1951-app
spec:
  replicas: 2
  minReadySeconds: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scholarship-applications
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scholarship-applications
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: scholarship-applications
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: scholarship-app-image:render-required
          imagePullPolicy: IfNotPresent
          # Let Traefik observe the terminating endpoint while Uvicorn still serves in-flight traffic.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "8"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: dv-ayan-kassen-1951-app-config
          env:
            - {name: DB_PASSWORD_FILE, value: /run/app-secrets/rw-password}
            - {name: SECRET_KEY_FILE, value: /run/app-secrets/secret-key}
            - {name: PASSWORD_MIN_LENGTH, value: "16"}
            - {name: PASSWORD_REQUIRE_SYMBOL, value: "false"}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 128Mi
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 4
          volumeMounts:
            - {name: credentials, mountPath: /run/app-secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: credentials
          secret:
            secretName: dv-ayan-kassen-1951-app-credentials
            defaultMode: 0440
            items:
              - {key: secret-key, path: secret-key}
              - {key: rw-password, path: rw-password}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
