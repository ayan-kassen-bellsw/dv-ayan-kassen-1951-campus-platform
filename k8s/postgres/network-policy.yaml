apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dv-ayan-kassen-1951-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: scholarship-applications
      ports:
        - protocol: TCP
          port: 5432
