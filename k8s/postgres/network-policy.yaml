apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dv-ayan-kassen-1951-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [scholarship-applications, scholarship-applications-prod]
      ports:
        - protocol: TCP
          port: 5432
