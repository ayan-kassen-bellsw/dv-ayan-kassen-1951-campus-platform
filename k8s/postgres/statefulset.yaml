apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dv-ayan-kassen-1951-postgres
spec:
  replicas: 1
  serviceName: dv-ayan-kassen-1951-postgres-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dv-ayan-kassen-1951-ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
                  - {key: node-role.kubernetes.io/master, operator: DoesNotExist}
      containers:
        - name: postgres
          image: postgres:17.12-bookworm
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: ["/bin/bash", "-ec"]
          args:
            - |
              /opt/scholarship-db/validate-passwords.sh
              exec /usr/local/bin/docker-entrypoint.sh postgres
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_PASSWORD_FILE, value: /run/scholarship-passwords/postgres-password}
            - {name: POSTGRES_INITDB_ARGS, value: "--auth-local=peer --auth-host=scram-sha-256"}
          lifecycle:
            postStart:
              exec:
                command: ["/opt/scholarship-db/reconcile.sh"]
          startupProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-U", "postgres"]
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - >-
                  export PGPASSWORD="$(cat /run/scholarship-passwords/rw-password)";
                  exec psql -Xqw -h 127.0.0.1 -U app_rw -d campus
                  -c 'SELECT id FROM public.items LIMIT 0'
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-U", "postgres"]
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 750m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: socket, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: bootstrap, mountPath: /opt/scholarship-db, readOnly: true}
            - {name: passwords, mountPath: /run/scholarship-passwords, readOnly: true}
      volumes:
        - {name: socket, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: bootstrap
          configMap:
            name: dv-ayan-kassen-1951-postgres-bootstrap
            defaultMode: 0555
        - name: passwords
          secret:
            secretName: dv-ayan-kassen-1951-postgres-credentials
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
